schema_version: 1
confirmations:
  collect: COLLECT_MX106_MODE3_BAM
safety:
  # The drop profile targets -88 deg and warns at -93 deg. The measured fixture
  # collision is -95 deg; keep the generic guard just inside that boundary.
  software_position_min_rad: -1.65  # -94.5 deg
  software_position_max_rad: 1.0
  maximum_temperature_c: 65
  minimum_input_voltage_v: 10.5
  maximum_input_voltage_v: 14.5
  maximum_abs_current_A: 2.8
  # Present PWM is already hard-clamped by the configured DYNAMIXEL PWM Limit.
  # Keep this monitor slightly above 1.0 so saturation is logged, not aborted.
  maximum_abs_pwm_fraction: 1.01
  maximum_abs_position_error_rad: 0.45
  # sin_time_square reaches a theoretical command speed of about 5.65 rad/s.
  maximum_abs_velocity_rad_s: 6.5
  between_runs_sec: 3.0
