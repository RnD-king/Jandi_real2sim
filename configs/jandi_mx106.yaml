schema_version: 1

bus:
  port: /dev/ttyUSB0
  baudrate: 4000000
  protocol_version: 2.0
  command_rate_hz: 100
  state_read_rate_hz: 99
  hardware_error_read_rate_hz: 1

experiment:
  transition_sec: 5.0
  center_hold_sec: 1.5
  default_step_amplitude_rad: 0.03

# id, zero_tick, direction은 실기체에서 반드시 확인한 뒤 입력한다.
# direction은 q_sim = direction * (q_dxl - zero_tick) * 2*pi/4096의 부호다.
# 하나라도 null이면 실제 Torque On 명령은 차단된다.
joints:
  RL1_joint: {id: 10, zero_tick: 2048, direction: -1, min_rad: -0.35, max_rad: 0.35, walking_rad: 0.0}
  RL2_joint: {id: 8, zero_tick: 2048, direction: 1, min_rad: -0.15, max_rad: 0.08, walking_rad: 0.0}
  RL3_joint: {id: 6, zero_tick: 2048, direction: -1, min_rad: 0.0, max_rad: 1.30, walking_rad: 0.98}
  RL4_joint: {id: 4, zero_tick: 2048, direction: 1, min_rad: -0.55, max_rad: 0.10, walking_rad: -0.40}
  RL5_joint: {id: 2, zero_tick: 2048, direction: 1, min_rad: 0.0, max_rad: 1.15, walking_rad: 0.84}
  RL6_joint: {id: 0, zero_tick: 2048, direction: -1, min_rad: -0.45, max_rad: 0.45, walking_rad: 0.0}
  LL1_joint: {id: 11, zero_tick: 2048, direction: -1, min_rad: -0.35, max_rad: 0.35, walking_rad: 0.0}
  LL2_joint: {id: 9, zero_tick: 2048, direction: 1, min_rad: -0.08, max_rad: 0.15, walking_rad: 0.0}
  LL3_joint: {id: 7, zero_tick: 2048, direction: -1, min_rad: -1.30, max_rad: 0.0, walking_rad: -0.98}
  LL4_joint: {id: 5, zero_tick: 2048, direction: 1, min_rad: -0.10, max_rad: 0.55, walking_rad: 0.40}
  LL5_joint: {id: 3, zero_tick: 2048, direction: 1, min_rad: -1.15, max_rad: 0.0, walking_rad: -0.84}
  LL6_joint: {id: 1, zero_tick: 2048, direction: -1, min_rad: -0.45, max_rad: 0.45, walking_rad: 0.0}
