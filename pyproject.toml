[project]
name = "jandi-real2sim"
version = "0.1.0"
description = "100 Hz MX-106 data collection and Real-to-Sim identification for Jandi"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "dynamixel-sdk>=3.8,<4",
    "matplotlib>=3.9,<4",
    "mujoco>=3.3,<4",
    "numpy>=1.26,<2.5",
    "pyyaml>=6,<7",
    "pyqtgraph>=0.13.7,<1",
    "pyside6>=6.8,<7",
    "scipy>=1.14,<2",
]

[project.scripts]
jandi-r2s-mode3-bam-calibrate = "jandi_real2sim.mode3_bam.calibrate:main"
jandi-r2s-mode3-bam-gui = "jandi_real2sim.mode3_bam.gui_app:main"
jandi-r2s-mode3-bam-mujoco = "jandi_real2sim.mode3_bam.mujoco_validation:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true
